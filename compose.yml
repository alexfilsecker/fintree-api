services:
  fintree-api:
    image: fintree-api
    container_name: fintree-api
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev
    restart: always
    env_file:
      - .envs/.local/.api.env
    ports:
      - 3030:3030
    volumes:
      - type: bind
        source: ./src
        target: /app/src
      - type: bind
        source: ./prisma
        target: /app/prisma
    networks:
      - fintree-network
    depends_on:
      - fintree-db

  fintree-db:
    image: postgres
    container_name: fintree-db
    env_file:
      - .envs/.local/.postgres.env
    ports:
      - 5432:5432
    volumes:
      - fintree-db-data:/var/lib/postgresql/data
    networks:
      - fintree-network

volumes:
  fintree-db-data:
    name: fintree-db-data

networks:
  fintree-network:
    driver: bridge
    name: fintree-network
